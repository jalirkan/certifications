<script>
// Stamp theme and cert before first paint so there is no flash of the wrong
// theme. Mirrors the logic in AppProvider, which takes over after mount.
try {
  var t = localStorage.getItem('study.theme') || 'dark'
  if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
  document.documentElement.dataset.theme = t
  var c = localStorage.getItem('study.cert')
  if (c) document.documentElement.dataset.cert = c
} catch (e) { /* storage may be unavailable; the default theme is fine */ }
</script>
